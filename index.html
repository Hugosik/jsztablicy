<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>mnozenie</title>
</head>
<body>

    <input type="number" value = "1" id="1">
    <input type="number" value ="2" id="2">

    <button type="button" onclick="sprawdz()">KLIKNIJ</button>

    <div id="iloczyn">tutaj bedzie wynik</div>

    <script>
        function sprawdz() {
            let liczba = document.getElementById("1").value;
            let liczbadwa = document.getElementById("2").value;
            let wynik = liczba * liczbadwa;
            document.getElementById("iloczyn").innerHTML = wynik;
        }   
    </script>

</body>
</html>
